[project]
name = "png2svg"
version = "0.1.0"
description = "Convert PNG images into scalable hexagonal SVG wallpapers"
readme = "README.md"
authors = [
    { name = "sanaiftikharh", email = "sanaiftikharh@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mypy>=2.4.0",
    "pillow>=12.3.0",
]

[project.scripts]
png2svg = "png2svg.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.25.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
